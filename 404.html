<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Spoiled &amp; Iced</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBDBEC" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0D10" />
  <style>
    :root{
      --bg:#FBDBEC; --card:#FFEFF7; --txt:#5B1F3D; --dim:#8A5470;
      --pink:#E8579B; --line:#F3B9D6;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0C0D10; --card:#15161C; --txt:#F2EEF6; --dim:#9A93A8; --pink:#FF5FA2; --line:#2A2B33; }
    }
    *{ box-sizing:border-box; margin:0; }
    body{
      min-height:100svh; display:grid; place-items:center; padding:24px;
      background:var(--bg); color:var(--txt);
      font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      text-align:center;
    }
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:22px;
      padding:44px 34px; max-width:420px; width:100%;
      box-shadow:0 24px 60px -35px rgba(120,40,110,.55);
    }
    .big{ font-size:64px; line-height:1; }
    h1{ font-size:1.6rem; margin:14px 0 8px; letter-spacing:.02em; text-transform:uppercase; }
    p{ color:var(--dim); font-size:.95rem; line-height:1.5; }
    a.btn{
      display:inline-block; margin-top:22px; padding:14px 26px; border-radius:999px;
      background:var(--pink); color:#fff; text-decoration:none; font-weight:700;
      letter-spacing:.04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="big" aria-hidden="true">💎</div>
    <h1>404 — this piece isn't in the drop</h1>
    <p>The page you're after doesn't exist (or got voted out). Head back and cast your votes.</p>
    <a class="btn" href="/">Back to the drop →</a>
  </main>
</body>
</html>
